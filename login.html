<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NGOConnect</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #fff;
      padding: 2.5rem 2rem 2rem 2rem;
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(79,70,229,0.10);
      max-width: 350px;
      width: 100%;
      text-align: center;
    }
    .login-container h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #222;
      margin-bottom: 1.5rem;
      letter-spacing: 1px;
    }
    .login-container label {
      display: block;
      text-align: left;
      margin-bottom: 0.5rem;
      color: #374151;
      font-weight: 500;
    }
    .login-container input[type="email"],
    .login-container input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 20px;
      border: 1.5px solid #d1d5db;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      outline: none;
      transition: border 0.2s;
    }
    .login-container input[type="email"]:focus,
    .login-container input[type="password"]:focus {
      border: 1.5px solid #4F46E5;
    }
    .remember-row {
      display: flex;
      align-items: center;
      margin-bottom: 1.2rem;
      text-align: left;
    }
    .remember-row label {
      margin: 0 0 0 0.5rem;
      font-weight: 400;
      color: #222;
      font-size: 0.98rem;
    }
    .login-btn {
      width: 100%;
      padding: 0.8rem 0;
      border-radius: 20px;
      border: none;
      background: #ff5a1f;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: background 0.2s, color 0.2s;
    }
    .login-btn:hover {
      background: #e04a0f;
    }
    .footer-link {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      color: #6B7280;
    }
    .footer-link a {
      color: #ff5a1f;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
    .google-btn {
      width: 100%;
      padding: 0.8rem 0;
      border-radius: 20px;
      border: none;
      background: #1877f2;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      margin-top: 1.2rem;
      transition: background 0.2s, color 0.2s;
    }
    .google-btn:hover {
      background: #125dc1;
    }
    .google-icon {
      background: #fff;
      border-radius: 50%;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>LOGIN</h1>
    <form id="loginForm">
      <label for="email">Usorname</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />
      <div class="remember-row">
        <input type="checkbox" id="rememberMe" name="rememberMe" style="accent-color:#4F46E5;">
        <label for="rememberMe">Remember me?</label>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <div class="footer-link">
      Dont have an account? <a href="signup.html">Create one.</a>
    </div>
    <div id="loginError" style="color:red;margin-top:1rem;"></div>
  </div>
  <!-- Remove the existing script tags and add this: -->
  <script type="module" src="login.js"></script>
</body>
</html>
